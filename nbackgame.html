<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Back Game</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 10px; }

        /* スクリーン切り替え用 */
        .screen { display: none; width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; }
        .active { display: block; }

        /* スタート画面 */
        .setup-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        select { font-size: 1.2rem; padding: 5px; margin: 10px; }
        
        /* ゲーム画面 */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-weight: bold;
            color: #555;
        }

        /* カード表示エリア */
        .card-container {
            position: relative;
            height: 200px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 120px;
            height: 160px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* 過去のカード（裏向き） */
        .past-cards {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            opacity: 0.6;
        }
        .back-card {
            width: 40px;
            height: 60px;
            background: repeating-linear-gradient(
                45deg,
                #606dbc,
                #606dbc 5px,
                #465298 5px,
                #465298 10px
            );
            border-radius: 5px;
            border: 1px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 操作ボタン */
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 0 #0056b3;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .feedback {
            height: 30px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .feedback.correct { color: #28a745; }
        .feedback.wrong { color: #dc3545; }

        /* 結果画面 */
        .score-board {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .score-detail {
            text-align: left;
            margin: 20px auto;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active">
        <div class="setup-box">
            <h1>N-Back Game</h1>
            <p>ルール: カードが次々とめくられます。<br><strong>N回前</strong>と同じ数字が出たらボタンを押してください。</p>
            <label>Nの値を設定 (1-5):
                <select id="n-value">
                    <option value="1">1-Back (簡単)</option>
                    <option value="2" selected>2-Back (普通)</option>
                    <option value="3">3-Back (難しい)</option>
                    <option value="4">4-Back (超難問)</option>
                    <option value="5">5-Back (鬼)</option>
                </select>
            </label>
            <br><br>
            <button class="btn" onclick="startGame()">ゲームスタート</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="status-bar">
            <span id="progress-display">Card: 0/50</span>
            <span id="n-display">N = 2</span>
        </div>

        <div class="game-area">
            <div class="past-cards">
                <div class="back-card"></div>
                <div class="back-card"></div>
                <div class="back-card"></div>
                <div class="back-card"></div>
                <div class="back-card"></div>
            </div>

            <div class="card-container">
                <div id="main-card" class="main-card">?</div>
            </div>

            <div id="feedback-msg" class="feedback"></div>

            <button id="n-back-btn" class="btn" onclick="checkMatch()">N-BACK!</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <div class="score-board">
            <h1>Game Over</h1>
            <h2>正答率: <span id="accuracy-display">0%</span></h2>
            <div class="score-detail">
                <p>正解 (Hit): <span id="score-hit">0</span></p>
                <p>見逃し (Miss): <span id="score-miss">0</span></p>
                <p>お手つき (False Alarm): <span id="score-false">0</span></p>
                <p>ターゲット出現数: <span id="total-targets">0</span></p>
            </div>
            <br>
            <button class="btn" onclick="resetGame()">もう一度遊ぶ</button>
        </div>
    </div>

    <script>
        // 設定値
        const TOTAL_CARDS = 50;
        const CARD_INTERVAL = 2000; // 2秒ごとに更新
        
        // 状態変数
        let nValue = 2;
        let deck = [];
        let currentIndex = -1;
        let gameInterval = null;
        let hasPressedButton = false; // 今のカードでボタンを押したか

        // スコア用変数
        let correctHits = 0;    // 正解数
        let misses = 0;         // 見逃し
        let falseAlarms = 0;    // お手つき
        let targetCount = 0;    // 実際にマッチした回数

        // DOM要素
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const mainCard = document.getElementById('main-card');
        const feedbackMsg = document.getElementById('feedback-msg');
        const progressDisplay = document.getElementById('progress-display');
        const nbackBtn = document.getElementById('n-back-btn');

        // ゲーム開始
        function startGame() {
            nValue = parseInt(document.getElementById('n-value').value);
            document.getElementById('n-display').innerText = `N = ${nValue}`;
            
            // デッキ生成 (1-5の乱数)
            deck = [];
            for (let i = 0; i < TOTAL_CARDS; i++) {
                deck.push(Math.floor(Math.random() * 5) + 1);
            }

            // 変数リセット
            currentIndex = -1;
            correctHits = 0;
            misses = 0;
            falseAlarms = 0;
            targetCount = 0;
            
            // 画面切り替え
            startScreen.classList.remove('active');
            gameScreen.classList.add('active');
            resultScreen.classList.remove('active');
            
            // カウントダウン的な間をおいて開始
            mainCard.innerText = "Ready";
            feedbackMsg.innerText = "";
            nbackBtn.disabled = true;

            setTimeout(() => {
                nextCard(); // 最初の1枚
                gameInterval = setInterval(nextCard, CARD_INTERVAL);
            }, 1000);
        }

        // 次のカードへ
        function nextCard() {
            // 前のカードの判定（見逃しチェック）
            if (currentIndex >= 0) {
                checkMissed();
            }

            currentIndex++;

            // 終了判定
            if (currentIndex >= TOTAL_CARDS) {
                endGame();
                return;
            }

            // 状態更新
            hasPressedButton = false;
            nbackBtn.disabled = false;
            feedbackMsg.innerText = ""; 

            // 表示更新
            mainCard.innerText = deck[currentIndex];
            progressDisplay.innerText = `Card: ${currentIndex + 1}/${TOTAL_CARDS}`;

            // ボタンの有効化判定 (N枚目までは押しても意味がないためグレーアウトするか、あるいは押させて失敗させるか。
            // ここでは一貫性のために押せる状態にするが、N手前までは正解が存在しない。)
            if (currentIndex < nValue) {
                // まだNバックできない期間
                // nbackBtn.disabled = true; // お好みで有効化してください
            }
        }

        // プレイヤーのアクション（ボタン押下）
        function checkMatch() {
            if (hasPressedButton) return; // 連打防止
            hasPressedButton = true;
            nbackBtn.disabled = true; // 1ターン1回のみ

            const currentNum = deck[currentIndex];
            // N回前が存在し、かつ一致するか
            if (currentIndex >= nValue && deck[currentIndex - nValue] === currentNum) {
                // 正解！
                correctHits++;
                showFeedback("正解！", "correct");
            } else {
                // お手つき！
                falseAlarms++;
                showFeedback("不正解...", "wrong");
            }
        }

        // 見逃し判定（次のカードに行く直前に実行）
        function checkMissed() {
            // N回前が存在するか
            if (currentIndex >= nValue) {
                const isMatch = deck[currentIndex] === deck[currentIndex - nValue];
                
                if (isMatch) {
                    // 本来はマッチしていた
                    if (!hasPressedButton) {
                        misses++; // ボタンを押していなければ見逃し
                    }
                    targetCount++; // マッチ総数をカウント
                }
            }
        }

        function showFeedback(text, type) {
            feedbackMsg.innerText = text;
            feedbackMsg.className = "feedback " + type;
        }

        // ゲーム終了処理
        function endGame() {
            clearInterval(gameInterval);
            gameScreen.classList.remove('active');
            resultScreen.classList.add('active');

            // 集計
            // 正答率の計算方法: (正解数) / (ターゲット総数) * 100
            // もしくは、お手つきも減点要素にするなどルールはいろいろありますが、
            // ここではシンプルに「出現したチャンスのうち、どれだけ拾えたか」を表示します。
            
            let accuracy = 0;
            if (targetCount > 0) {
                accuracy = Math.round((correctHits / targetCount) * 100);
            }

            document.getElementById('accuracy-display').innerText = `${accuracy}%`;
            document.getElementById('score-hit').innerText = correctHits;
            document.getElementById('score-miss').innerText = misses;
            document.getElementById('score-false').innerText = falseAlarms;
            document.getElementById('total-targets').innerText = targetCount;
        }

        function resetGame() {
            resultScreen.classList.remove('active');
            startScreen.classList.add('active');
        }
    </script>
</body>
</html>
